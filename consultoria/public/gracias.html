<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Recibimos tu interés — Consultoría de IA</title>
<meta name="theme-color" content="#0B0D0C">
<script>
(function () {
  try {
    var saved = localStorage.getItem("gpv-theme");
    var theme = saved === "light" || saved === "dark" ? saved
      : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="wrap mini">
  <p class="eyebrow"><span class="pulse" aria-hidden="true"></span> Consultoría de IA</p>
  <h1 class="mini-title">Recibí tu interés.</h1>
  <p class="mini-lead">Te escribo para coordinar la llamada de diagnóstico. No es un contrato.</p>
  <p class="mini-actions">
    <a class="btn-lime mono" href="/">Volver al inicio</a>
    <a class="btn-ghost mono js-wa" href="https://wa.me/50600000000">WhatsApp</a>
  </p>
</main>
<script src="/app.js"></script>
</body>
</html>
